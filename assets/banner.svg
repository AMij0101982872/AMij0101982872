<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Aké Mobio Ivan Junior · Élève ingénieur Big Data &amp; IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow2)"/>

  <!-- Réseau de nœuds (graphe d'agents) à droite -->
  <g stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M930 90 L1030 140 L990 230 L880 200 Z"/>
    <path d="M930 90 L990 230 M1030 140 L880 200 M1030 140 L1110 95 M990 230 L1100 220"/>
  </g>
  <g fill="#0b1220" stroke="url(#accent)" stroke-width="2">
    <circle cx="930" cy="90" r="9"/>
    <circle cx="1030" cy="140" r="12"/>
    <circle cx="990" cy="230" r="9"/>
    <circle cx="880" cy="200" r="8"/>
    <circle cx="1110" cy="95" r="6"/>
    <circle cx="1100" cy="220" r="6"/>
  </g>
  <circle cx="1030" cy="140" r="4" fill="#2dd4bf"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="64" y="64" width="44" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="128" fill="#f8fafc" font-size="48" font-weight="700" letter-spacing="-0.5">Aké Mobio Ivan Junior</text>
    <text x="64" y="172" fill="url(#accent)" font-size="24" font-weight="600">Élève ingénieur Big Data &amp; Intelligence Artificielle</text>
    <text x="64" y="214" fill="#94a3b8" font-size="18">Data Science · Agents IA · Data Engineering · Business Intelligence</text>
    <text x="64" y="252" fill="#64748b" font-size="15" letter-spacing="1.5">CASABLANCA, MAROC  ·  HESTIM  ·  DISPONIBLE POUR UN PFE EN FÉVRIER 2027</text>
  </g>
</svg>
